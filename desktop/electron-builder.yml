appId: com.shopapp.desktop
productName: ShopApp
copyright: Copyright © Mndima Technologies

directories:
  output: dist
  # icon.ico (16-256 px; logo-only art at small sizes) is the app, installer and taskbar icon.
  buildResources: resources

files:
  - main.js
  - preload.js
  - escpos.js
  - splash.html
  - package.json

# The PHP runtime and the Laravel app live next to the asar, untouched.
extraResources:
  - from: build/php
    to: php
  - from: build/app
    to: app

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ShopApp-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Shop data (database, backups) lives in %APPDATA%\ShopApp and is kept.
  deleteAppDataOnUninstall: false
  # Deletes the installer once ShopApp is installed (kept on USB/network drives or with /KEEP).
  include: resources/installer.nsh

# With GH_TOKEN set, `npm run release` uploads the installer + latest.yml here; the app checks for updates.
# Builds always run locally.
publish:
  provider: github
  owner: gameracer
  repo: ShopApp
  releaseType: release
